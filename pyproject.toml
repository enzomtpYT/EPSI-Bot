[project]
name = "epsi-bot"
version = "2.0.0"
description = "Discord Bot for EPSI Hyperplanning iCal schedules"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "discord.py>=2.4.0",
    "aiohttp>=3.9.0",
    "python-dotenv>=1.0.0",
    "pillow>=10.2.0",
    "sqlmodel>=0.0.19",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "icalendar>=5.0.12",
    "recurring-ical-events>=2.1.0",
    "pytz>=2024.1",
    "aiocron>=2.1",
    "pydantic>=2.7.0",
    "font-roboto>=0.0.1",
    "fastapi>=0.142.2",
    "uvicorn>=0.54.0",
    "jinja2>=3.1.6",
    "itsdangerous>=2.2.0",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
